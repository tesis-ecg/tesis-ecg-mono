name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `backend` es el job lento (minutos de tests del motor), así que en un PR solo
  # corre si el PR toca algo de lo que depende. En `push` a main corre siempre:
  # es la red de seguridad si este filtro se queda corto.
  #
  # Se filtra a nivel de job y no con `paths:` en `on:`. Un job salteado cuenta
  # como exitoso, así que sigue siendo seguro si algún día `backend` pasa a ser un
  # check requerido; con `paths:` a nivel de workflow, ese check nunca se
  # reportaría y el PR quedaría esperándolo para siempre.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'back/**'
              # `export_openapi --check` compara el contrato del backend con este
              # archivo: un cambio a mano ahí rompe el job aunque `back/` no cambie.
              - 'front/src/generated/**'
              - '.github/workflows/ci.yml'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run budget

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `expo export` compila el bundle con Metro: es lo que detecta que el
      # pipeline de NativeWind/lightningcss se rompió, cosa que ni el
      # type-check ni el lint ven.
      - run: npx expo export --platform android --output-dir /tmp/expo-export
      - run: npx expo-doctor

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: holter
          POSTGRES_PASSWORD: holter
          POSTGRES_DB: holter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U holter -d holter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: back
    env:
      DATABASE_URL: postgresql+asyncpg://holter:holter@localhost:5432/holter_test
      S3_BUCKET_NAME: holter-test
      AWS_ACCESS_KEY_ID: test-access
      AWS_SECRET_ACCESS_KEY: test-secret
      AUTH0_DOMAIN: tenant.example.auth0.com
      AUTH0_CLIENT_ID: test-client
      AUTH0_CLIENT_SECRET: test-secret
      AUTH0_AUDIENCE: https://api.holter.test
      AUTH0_MGMT_CLIENT_ID: test-mgmt
      AUTH0_MGMT_CLIENT_SECRET: test-secret
      JWT_SECRET: test-secret-with-at-least-thirty-two-characters
      READINESS_TOKEN: test-readiness-token-with-at-least-thirty-two-characters
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check app tests alembic index.py
      - run: uv run ruff format --check app tests alembic index.py
      - run: uv run mypy app
      - run: uv run python -m app.scripts.export_openapi --check
      - run: uv run alembic upgrade head
      # En paralelo (pytest-xdist), un proceso y una base por núcleo
      # (`tests/conftest.py`). `worksteal` reparte de nuevo cuando un worker se
      # queda sin tests: los del motor tardan mucho más que el resto.
      - run: uv run pytest -m "not slow" -n auto --dist worksteal --cov=app --cov-report=term-missing --cov-fail-under=65
      # Los `slow` procesan un lote realista de 1 h (~6.480 tramas). Van
      # aparte para no sumar minutos a cada push, pero igual corren en CI.
      - run: uv run pytest -m slow -n auto --dist worksteal
      - run: uvx bandit -q -r app

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cp back/.env.example back/.env
      - run: docker compose config --quiet
      - run: python -m json.tool back/vercel.json > /dev/null
      - run: docker build -t holter-backend:test back
      - uses: trufflesecurity/trufflehog@main
