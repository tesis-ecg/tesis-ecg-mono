# Full local stack: Postgres + RustFS (S3) + FastAPI backend + Vite frontend.
# Backend and frontend both run with hot reload and source bind-mounts.
#
#   docker compose up            # build (first run) + start everything
#   docker compose up --build    # force rebuild after dependency changes
#   docker compose down          # stop; add -v to also wipe the db/s3 volumes
#
# URLs once up:
#   Frontend   http://localhost:5173
#   API        http://localhost:8000   (docs at /docs)
#   S3 API     http://localhost:9000    console http://localhost:9001 (minioadmin/minioadmin)
#   Postgres   localhost:5435           (holter/holter)

services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: holter
      POSTGRES_USER: holter
      POSTGRES_PASSWORD: holter
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holter"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RustFS, an S3-compatible server. It replaced MinIO, which no longer publishes
  # community images: the minio/minio repository on Docker Hub is gone and
  # quay.io/minio/minio has no tags, so `docker compose up` could not pull it.
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # The browser downloads the ECG straight from here with a presigned URL, from
      # another origin than the dashboard's, so the responses need CORS headers.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    # Apply migrations, then run uvicorn with --reload. The ./back/app bind-mount below
    # makes the reloader pick up code edits on the host instantly.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./back/app:/app/app
      - ./back/alembic:/app/alembic
    env_file:
      - ./back/.env
    environment:
      # Override the .env values so the container talks to the compose services
      # (the .env defaults point at localhost for running the API outside Docker).
      DATABASE_URL: postgresql+asyncpg://holter:holter@db:5432/holter
      S3_ENDPOINT_URL: http://s3:9000
      # Las URLs prefirmadas las descarga el navegador (en el host), no el backend:
      # se firman contra el puerto publicado del servidor S3.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Bind-mount source for HMR; keep the container's linux node_modules isolated
      # from the host's (macOS) binaries via an anonymous volume. The entrypoint
      # reinstalls deps when package-lock.json changes, so the volume never goes stale.
      - ./front:/app
      - /app/node_modules
    environment:
      # Vite expone /api al browser y resuelve este origen dentro de Compose.
      BACKEND_ORIGIN: http://back:8000
      # File-watch polling — required for reliable HMR over bind mounts on macOS/Windows.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      back:
        condition: service_healthy

volumes:
  postgres_data:
  s3_data:
