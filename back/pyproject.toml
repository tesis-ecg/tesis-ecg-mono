[project]
name = "holter-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "boto3>=1.35",
    "cryptography>=44",
    "httpx>=0.27",
    "structlog>=24.0",
    # Runtime, no solo para el seed: el decodificador de tramas y la pirámide
    # min/max del ECG corren en el camino de ingesta (app/ml/decompression.py,
    # app/modules/ingest/processing.py).
    "numpy>=2.0",
]

[dependency-groups]
seed = []
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "ruff",
    "mypy",
    "faker",
    "moto[s3]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
# Los scripts son entrypoints de CLI (seed, export-openapi, reconcile), no
# código del camino de request. CI ya los ejercita por otro lado
# (`export_openapi --check`, `alembic upgrade head`), y contarlos en el gate
# solo diluye la señal de la cobertura que sí importa.
omit = ["app/scripts/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: tests que procesan un batch realista de 1 h (se excluyen con -m 'not slow')",
]
